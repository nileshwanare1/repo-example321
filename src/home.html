<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Home Page</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #222;
            transition: 0.3s;
        }

        header {
            background: #2563eb;
            color: white;
            padding: 20px;
            text-align: center;
        }

        nav {
            margin-top: 10px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 0 15px;
        }

        .container {
            max-width: 900px;
            margin: 50px auto;
            padding: 20px;
            text-align: center;
        }

        .card {
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        button {
            margin-top: 20px;
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        #message {
            margin-top: 20px;
            font-size: 20px;
            font-weight: bold;
        }

        .dark {
            background: #111827;
            color: white;
        }

        .dark .card {
            background: #1f2937;
            color: white;
        }

        footer {
            margin-top: 40px;
            padding: 20px;
            text-align: center;
        }
    </style>
</head>

<body>

<header>
    <h1>Welcome to My Home Page</h1>

    <nav>
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Contact</a>
    </nav>
</header>

<div class="container">

    <div class="card">
        <h2>Hello 👋</h2>

        <p>
            This is a simple interactive HTML home page.
        </p>

        <button onclick="showMessage()">
            Click Me
        </button>

        <button onclick="toggleDarkMode()">
            🌙 Dark Mode
        </button>

        <div id="message"></div>
    </div>

</div>

<footer>
    © 2026 My Website
</footer>

<script>
    function showMessage() {
        document.getElementById("message").innerHTML =
            "🎉 Welcome! You clicked the button.";
    }

    function toggleDarkMode() {
        document.body.classList.toggle("dark");
    }
</script>

</body>
</html>
